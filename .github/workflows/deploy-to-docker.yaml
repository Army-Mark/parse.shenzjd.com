name: Test, build and deploy

# 【自建改造】本服务器线上是 systemd 直跑 node（/opt/parse/app + server.js），
# 与本工作流的 Docker 方案抢同一个 3000 端口，二者只能留一个。默认整体关闭：
# 所有 job 都需要仓库变量 ENABLE_DOCKER_DEPLOY == 'true' 才执行，否则直接跳过。
#
# 为什么是「默认关闭」而不是删掉：
#   1. 本工作流属于上游文件，每次同步都会被「固定为上一版本」，删掉又会被上游带回来，
#      维护成本高；加一个开关更稳。
#   2. 关闭后不再消耗 Actions 配额（每次同步 push 都会触发一次 Docker 构建并推 GHCR）。
#
# 想改用 Docker 部署：在 Settings → Secrets and variables → Actions → Variables 新建
#   ENABLE_DOCKER_DEPLOY = true，并补齐 DEPLOY_HOST / DEPLOY_USER / DEPLOY_PASSWORD，
#   同时停用 selfhost-sync.yml 里的 deploy 任务（否则两边同时抢端口）。

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".github/workflows/deploy-to-docker.yaml"
      - "src/**"
      - "**/*.ts"
      - "**/*.tsx"
      - "public/**"
      - "next.config.*"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "package.json"
      - "package-lock.json"
      - "tailwind.config.ts"
      - "postcss.config.mjs"
  pull_request:
    paths:
      - "Dockerfile"
      - ".github/workflows/deploy-to-docker.yaml"
      - "src/**"
      - "**/*.ts"
      - "**/*.tsx"
      - "public/**"
      - "next.config.*"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "package.json"
      - "package-lock.json"
      - "tailwind.config.ts"
      - "postcss.config.mjs"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    # 默认关闭：改用 systemd 部署后这条 Docker 链路只在显式开启时才跑（见文件头说明）
    if: vars.ENABLE_DOCKER_DEPLOY == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run live parse tests (real links via /api/parse)
        # 真机解析：用内置真实链接走统一接口 /api/parse 回归各平台。
        # parse-live.test.ts 依赖 LIVE_URL_* 环境变量，未配置时自动跳过（0 用例）；
        # 各 *-note.test.ts 内置真实链接，会真实请求上游，验证统一接口聚合正确。
        # 真实链接受上游网络/反爬/限流影响可能偶发失败，故 continue-on-error，
        # 不阻断单元测试与部署（单元测试 npm test 才是硬性门槛）。
        continue-on-error: true
        run: npm run test:live

  build:
    runs-on: ubuntu-latest
    needs: [test]
    if: vars.ENABLE_DOCKER_DEPLOY == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Docker daemon with mirror
        run: |
          sudo mkdir -p /etc/docker
          echo '{"registry-mirrors":["https://docker.1ms.run"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker || sudo service docker restart

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version from package.json
        id: ver
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Version: $VER"

      - name: Extract metadata for GHCR
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          # 不用 GHA 缓存：cleanup-actions.yaml 每天清空全部缓存（免费配额仅 0.5GB，
          # 装不下镜像层），cache-from 永远命中不了，而 cache-to 导出全部层实测
          # 每次耗时 ~168s（2026-09-08 构建日志），纯属浪费，故移除。
          provenance: false
          sbom: false
          # 传入 git sha 作为稳定 buildId，避免滚动部署前后端 build 不一致
          build-args: |
            BUILD_ID=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 默认关闭；且仅 main 分支部署（见文件头说明）
    if: github.ref == 'refs/heads/main' && vars.ENABLE_DOCKER_DEPLOY == 'true'
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest"
            CONTAINER="${{ github.event.repository.name }}"
            # 【改造说明】原路径硬编码作者服务器的站点目录，自建部署必须替换。
            # 优先读取仓库变量 DEPLOY_ENV_FILE（Settings → Variables），
            # 未配置时回退到应用目录下的 .env。
            ENV_FILE="${{ vars.DEPLOY_ENV_FILE }}"
            if [ -z "$ENV_FILE" ]; then ENV_FILE="/opt/parse/.env"; fi
            # 宿主机映射端口同样可配，默认 3000
            HOST_PORT="${{ vars.DEPLOY_PORT }}"
            if [ -z "$HOST_PORT" ]; then HOST_PORT=3000; fi
            sudo docker pull "$IMAGE"
            sudo docker stop "$CONTAINER" || true
            sudo docker rm "$CONTAINER" || true
            ENV_FLAGS=""
            if [ -f "$ENV_FILE" ]; then
              ENV_FLAGS="--env-file $ENV_FILE"
            fi
            # PO Token 提供方为独立工程自建的 bgutil-ytdlp-pot-provider 容器（宿主机端口），
            # 本部署不创建、不启停、不管理它。应用容器经 host-gateway 访问宿主机端口，
            # 具体地址在服务器 .env 的 POT_BASE_URL 配置（服务无鉴权，地址禁止写入本公开
            # 仓库）；未配置时 PO Token 功能自动关闭，插件连不上仅降级，不影响解析主流程。
            # --init：node 作 PID1 不回收孤儿僵尸进程，累积后会拖垮子进程 spawn
            sudo docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              --init \
              $ENV_FLAGS \
              -p "${HOST_PORT}:3000" \
              "$IMAGE"
            sudo docker image prune -f
